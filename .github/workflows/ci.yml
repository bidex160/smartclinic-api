name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - 'audit/**'

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Check duplicate migration timestamps
        shell: bash
        run: |
          dupes="$(find src/database/migrations -maxdepth 1 -type f -printf '%f\n' | sed -n 's/^\([0-9][0-9]*\)-.*/\1/p' | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration timestamps found: $dupes"
            exit 1
          fi
