name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - 'audit/**'

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Check duplicate migration timestamps
        shell: bash
        run: |
          names=$(grep -hE '^[[:space:]]*name[[:space:]]*=' src/database/migrations/*.ts | grep -Eo '[0-9]{13}' || true)
          dupes=$(printf '%s\n' "$names" | awk '$0 != "1792512000000"' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration timestamps found: $dupes"
            exit 1
          fi
